name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nøklene under er offentlige klientnøkler (bakes uansett inn i bundelen);
      # tilgangskontrollen ligger i Supabase RLS, ikke i nøkkelen.
      - run: npm run build -- --base=/navyrace/
        env:
          VITE_SUPABASE_URL: https://kkxkenddtbhlhntmzvhp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_VhmVssnlCv6vRk3-NIefRQ_UQtY8KPH
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
