<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5F2" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="lodd.ai — your  iMessage coach." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/lodd.css" />
    <title>lodd.ai</title>
  </head>
  <body>
    <main class="stage stage-signup">
      <header class="signup-head">
        <p class="mark">lodd.ai</p>
        <h1 data-i18n="signupTitle">Your  iMessage coach</h1>
        <p data-i18n="signupLead">You text. Your coach texts back.</p>
      </header>
      <form class="signup-form" id="signup-form">
        <div class="field-block">
          <div class="lang-seg" role="group" data-i18n-aria="language" aria-label="Language">
            <button type="button" data-lang="no">NO</button>
            <button type="button" data-lang="sv">SV</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <label class="field">
            <input
              id="pt-name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder=" "
              maxlength="80"
              required
            />
            <span class="field-label" data-i18n="name">Name</span>
          </label>
          <label class="field">
            <input
              id="pt-phone"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="+47"
              maxlength="20"
              required
            />
            <span class="field-label" data-i18n="phone">Phone</span>
          </label>
        </div>
        <button class="btn btn-solid" type="submit" data-i18n="send">Send  iMessage</button>
        <p class="legal">
          <span data-i18n="consent">By sending, you agree to be contacted.</span>
          <a href="./vilkar/" data-i18n="terms">Terms</a>
        </p>
        <p class="form-note" data-pt-status hidden></p>
      </form>
      <a class="btn btn-ghost" href="./app/" data-i18n="tryApp">Try the app instead</a>
    </main>
    <script type="module" src="/src/lodd.js"></script>
  </body>
</html>
