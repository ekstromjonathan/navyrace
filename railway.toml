[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["Dockerfile", "package.json", "package-lock.json", "index.html", "app/**", "vilkar/**", "src/**", "public/**", "pt/**", "scripts/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ALWAYS"

[variables]
PT_COACH_NAME = "lodd.ai"
PT_MODEL = "x-ai/grok-4.3"
PT_MODEL_SMART = "x-ai/grok-4.6"
PT_TZ = "Europe/Oslo"
PT_STATIC_DIR = "dist"
PT_REQUIRE_SPA = "1"
LINQ_ALLOWLIST = "+4740343295"
LINQ_FROM_NUMBER = "+14044465379"
