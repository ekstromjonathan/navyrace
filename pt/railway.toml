# Do not point the lodd.ai service here.
# Root Directory must be empty (repo root) so /railway.toml + Dockerfile run.
# That image builds the Vite app into pt/dist and starts this PT with spa=true.
#
# If a service accidentally uses rootDirectory=pt, it will only run the webhook
# (spa=false) and https://lodd.ai/ will 404.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ALWAYS"
